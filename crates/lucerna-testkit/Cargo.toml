[package]
name = "lucerna-testkit"
description = "Lucerna test harness, fake mpv and integration suites (never shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lucerna-core = { workspace = true, features = ["test-support"] }
lucerna-mpv.workspace = true
lucerna-x11.workspace = true
rustix.workspace = true
x11rb = { workspace = true, features = ["randr", "shape", "xtest"] }
lucerna-daemon.workspace = true
lucerna-cli.workspace = true
lucerna-ipc.workspace = true
zbus.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
toml.workspace = true

[[bin]]
name = "fake-mpv"
path = "src/bin/fake-mpv.rs"

[[bin]]
name = "lucernad-under-test"
path = "src/bin/lucernad-under-test.rs"

[[bin]]
name = "lucernactl-under-test"
path = "src/bin/lucernactl-under-test.rs"
