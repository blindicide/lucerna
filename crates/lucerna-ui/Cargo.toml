[package]
name = "lucerna-ui"
description = "lucerna: the Lucerna GTK 4 control application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lucerna-core.workspace = true
lucerna-ipc.workspace = true
clap.workspace = true
futures-util.workspace = true
gtk4.workspace = true
tracing.workspace = true
zbus.workspace = true

[[bin]]
name = "lucerna"
path = "src/main.rs"

[dev-dependencies]
lucerna-core = { workspace = true, features = ["test-support"] }
lucerna-daemon.workspace = true
lucerna-testkit = { path = "../lucerna-testkit" }
tokio.workspace = true

[[test]]
name = "ui_structure"
harness = false
