[workspace]
resolver = "3"
members = ["crates/*"]

# The single canonical version source for every binary, package and document (directive §29).
[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/blindicide/lucerna"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtk4 = { version = "0.11", features = ["v4_10"] }
rustix = { version = "1.1", features = ["process", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
thiserror = "2.0"
x11rb = { version = "0.14", features = ["randr", "shape"] }
tokio = { version = "1.53", features = ["rt", "macros", "process", "net", "io-util", "time", "sync", "signal"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zbus = "5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates. `publish = false` makes a version unnecessary, so the root
# `[workspace.package] version` stays the only place a version number is written.
lucerna-core = { path = "crates/lucerna-core" }
lucerna-mpv = { path = "crates/lucerna-mpv" }
lucerna-x11 = { path = "crates/lucerna-x11" }
lucerna-ipc = { path = "crates/lucerna-ipc" }
lucerna-daemon = { path = "crates/lucerna-daemon" }
lucerna-cli = { path = "crates/lucerna-cli" }
lucerna-ui = { path = "crates/lucerna-ui" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

# Line tables are enough for backtraces and keep the many test binaries small (full debug info made
# the target directory tens of gigabytes).
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
